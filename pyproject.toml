[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  "cmake>=3.18",
  "ninja; platform_system!='Windows'",
  "packaging",
  # use --no-build-isolation
  "torch>=2.7.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "fasteq"
version = "0.3.0"
description = "FastEq CUDA extensions"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["fasteq*"]

[tool.setuptools.package-data]
"fasteq.cuda" = [
  "CMakeLists.txt", "src/*.cu", "src/*.cpp", "src/*.h", "src/*.hpp", "src/*.cuh",
  "src/**/CMakeLists.txt", "src/**/*.cmake",
]
"fasteq.triton" = ["LICENSES"]
